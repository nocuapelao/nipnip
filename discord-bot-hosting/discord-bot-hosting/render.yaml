services:
  - type: web
    name: discord-bot-hosting
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && npm install
    startCommand: cd backend && node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MAX_BOTS_PER_CATEGORY
        value: 50
      - key: KEEPALIVE_CHECK_INTERVAL
        value: 30000
      - key: DEFAULT_ADMIN_EMAIL
        value: admin@platform.com
      - key: DEFAULT_ADMIN_PASSWORD
        value: Admin@123456
      - key: DB_PATH
        value: ./data/platform.db
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
